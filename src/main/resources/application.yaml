spring:
  application:
    name: dubbo-demo

# 数据源核心配置（Druid）
  datasource:
    # 指定使用Druid数据源（Druid Starter会自动装配，此配置可省略，显式声明更清晰）
    type: com.alibaba.druid.pool.DruidDataSource
    # Spring Boot 标准数据源配置（必须配置在顶层，druid-spring-boot-starter会自动识别）
    url: jdbc:mysql://localhost:3307/test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowMultiQueries=true
    username: root # 你的数据库账号
    password: 123456 # 你的数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL8驱动类（MySQL5用com.mysql.jdbc.Driver）
    # Druid特有配置前缀（druid-spring-boot-starter专属，可直接配置）
    druid:

      # ##### 连接池核心配置（Druid关键，按需调整）#####
      initial-size: 5 # 初始化连接数
      min-idle: 5 # 最小空闲连接数
      max-active: 20 # 最大活跃连接数
      max-wait: 60000 # 获取连接的最大等待时间（毫秒）
      time-between-eviction-runs-millis: 60000 # 检测空闲连接的时间间隔（毫秒）
      min-evictable-idle-time-millis: 300000 # 连接的最小空闲存活时间（毫秒）
      validation-query: SELECT 1 # 验证连接是否有效的SQL（MySQL通用）
      test-while-idle: true # 空闲时检测连接有效性
      test-on-borrow: false # 获取连接时不检测（提升性能，推荐false）
      test-on-return: false # 归还连接时不检测（提升性能，推荐false）
      pool-prepared-statements: true # 开启PSCache（预编译语句缓存）
      max-pool-prepared-statement-per-connection-size: 20 # 每个连接的PSCache大小

      # ##### Druid监控配置（核心优势，开启后可访问监控页面）#####
      # 1. 开启内置过滤器（stat：监控统计，wall：防SQL注入，log4j2：日志，根据日志框架调整）
      filters: stat,wall,log4j2
      # 2. 配置Web监控的Filter（统计web请求的SQL执行情况）
      web-stat-filter:
        enabled: true # 开启Web统计过滤器
        url-pattern: /* # 拦截所有请求
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" # 排除静态资源和监控页面
      # 3. 配置Druid监控页面的Servlet（访问入口：http://localhost:8080/druid/）
      stat-view-servlet:
        enabled: true # 开启监控页面
        url-pattern: /druid/* # 监控页面访问路径
        reset-enable: false # 禁止手动重置监控数据（防止误操作）
        login-username: druid # 监控页面登录账号（自定义）
        login-password: druid123 # 监控页面登录密码（自定义）
        # 允许访问监控页面的IP（白名单，*表示所有IP，也可指定如127.0.0.1,192.168.1.*）
        allow: '*'
        # 禁止访问的IP（黑名单，优先级高于白名单）
        # deny: 192.168.1.100

# ##### 日志配置（可选，打印SQL执行日志，方便调试）#####
logging:
  level:
    # 打印指定包下的SQL日志（替换为你的Mapper/DAO包路径）
    com.xxx.mapper: debug
    # 打印JDBC操作日志
    org.springframework.jdbc.core: debug
    org.apache.shardingsphere: debug

  # 不去分库分表
  shardingsphere:
    enabled: false

# 服务端口（可选，默认8080）
server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.lix.mycatdemo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 关键：禁用 Spring Boot 自带的数据源自动配置（避免冲突）
#spring.autoconfigure.exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration